plugins = []

[functions]

  [functions."*"]

[build]
# The built site is committed at the repository root (index.html, assets/, images/,
# and the pre-rendered page directories), so there is nothing to compile at deploy
# time. Publish the root and explicitly disable the build command so any command
# configured in the Netlify UI is overridden.
publish = "."
command = ""

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/*"

  [headers.values]
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
  Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests"

[[headers]]
for = "/admin*"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/checkout*"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/favoris*"

  [headers.values]
  X-Robots-Tag = "noindex, follow"

[[headers]]
for = "/assets/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/images/*"

  [headers.values]
  Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
for = "/fonts/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/sw.js"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  Service-Worker-Allowed = "/"

